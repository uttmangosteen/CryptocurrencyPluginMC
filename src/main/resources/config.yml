mongodb:
  connection-string: "mongodb://127.0.0.1:27017/?replicaSet=rs0"
  database: "cryptocurrency"

plugin:
  prefix: "§f§l[§7§lC§8§lC§f§l] "
  enable: true
  command-rate-limit-ms: 500

blockchain:
  mempool-limit-per-block: 10
  # 0で起動時の期限切れTX掃除を無効化
  mempool-transaction-ttl-hours: 24

mining-machine:
  delay-ticks: 20
  #このtickは↑による(↑が20(1秒)なら↓を60で1分毎保存)
  save-interval-mining-ticks: 60
